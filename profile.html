<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Profile | Education Platform</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="dashboard-page"><section class="dashboard-card" style="max-width:520px">
<div class="dashboard-header"><div><span class="dashboard-label">Account</span><h1>My Profile</h1></div><a href="index.html" id="backButton" class="btn btn-secondary">Back</a></div>

<h2 style="font-size:16px;margin-bottom:14px">Update Name</h2>
<form id="updateNameForm" novalidate>
<div class="form-group">
<label for="profileName">Full Name</label>
<input type="text" id="profileName" placeholder="Your name">
</div>
<div id="nameMessage" class="auth-message" aria-live="polite"></div>
<button type="submit" class="btn btn-primary btn-full">SAVE NAME</button>
</form>

<hr style="border:none;border-top:1px solid var(--border);margin:28px 0">

<section id="academicProfileSection">
<h2 style="font-size:16px;margin-bottom:14px">Academic Profile</h2>
<p style="color:var(--muted);font-size:12px;margin:-5px 0 16px">Keep your academic information updated for better student records.</p>
<form id="academicProfileForm" novalidate>
<div class="academic-grid">
<div class="form-group"><label for="studentId">Student ID</label><input id="studentId" type="text" placeholder="Student ID"></div>
<div class="form-group"><label for="className">Class / Grade</label><input id="className" type="text" placeholder="e.g. Class 8"></div>
<div class="form-group"><label for="section">Section</label><input id="section" type="text" placeholder="e.g. A"></div>
<div class="form-group"><label for="rollNumber">Roll Number</label><input id="rollNumber" type="text" placeholder="Roll number"></div>
<div class="form-group"><label for="groupName">Group</label><select id="groupName"><option value="">Select group</option><option>Science</option><option>Arts</option><option>Commerce</option><option>General</option></select></div>
<div class="form-group"><label for="institution">School / Institution</label><input id="institution" type="text" placeholder="Institution name"></div>
<div class="form-group"><label for="guardianName">Guardian Name</label><input id="guardianName" type="text" placeholder="Parent / guardian name"></div>
<div class="form-group"><label for="guardianPhone">Guardian Phone</label><input id="guardianPhone" type="tel" placeholder="Guardian mobile number"></div>
</div>
<div id="academicMessage" class="auth-message" aria-live="polite"></div>
<button type="submit" class="btn btn-primary btn-full">SAVE ACADEMIC PROFILE</button>
</form></section>

<hr style="border:none;border-top:1px solid var(--border);margin:28px 0">

<h2 style="font-size:16px;margin-bottom:14px">Change Password</h2>
<form id="changePasswordForm" novalidate>
<div class="form-group">
<label for="currentPassword">Current Password</label>
<div class="password-wrapper">
<input type="password" id="currentPassword" data-password-target="currentPassword">
<button type="button" class="password-toggle" data-password-target="currentPassword" aria-label="Show password">Show</button>
</div>
</div>
<div class="form-group">
<label for="newPassword">New Password</label>
<div class="password-wrapper">
<input type="password" id="newPassword" data-password-target="newPassword">
<button type="button" class="password-toggle" data-password-target="newPassword" aria-label="Show password">Show</button>
</div>
</div>
<div class="form-group">
<label for="confirmNewPassword">Confirm New Password</label>
<div class="password-wrapper">
<input type="password" id="confirmNewPassword" data-password-target="confirmNewPassword">
<button type="button" class="password-toggle" data-password-target="confirmNewPassword" aria-label="Show password">Show</button>
</div>
</div>
<div id="passwordMessage" class="auth-message" aria-live="polite"></div>
<button type="submit" class="btn btn-primary btn-full">CHANGE PASSWORD</button>
</form>
</section></main>
<script>window.EP_REQUIRED_ROLE = "any";</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-helpers.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard-guard.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
