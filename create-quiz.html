<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Quiz | Education Platform</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="dashboard-page"><section class="dashboard-card">
<div class="dashboard-header"><div><span class="dashboard-label">Create</span><h1>Create New Quiz</h1></div><a href="javascript:history.back()" class="btn btn-secondary">Back</a></div>

<form id="createQuizForm" novalidate>
<div class="form-group">
<label for="quizTitle">Quiz Title</label>
<input type="text" id="quizTitle" placeholder="e.g. Class 9 - Physics Chapter 1">
</div>
<div class="form-group">
<label for="quizDescription">Description <span class="optional">(optional)</span></label>
<input type="text" id="quizDescription" placeholder="Short description">
</div>

<div id="questionsContainer"></div>

<button type="button" id="addQuestionBtn" class="btn btn-secondary" style="margin-bottom:20px">+ Add Question</button>

<div id="createQuizMessage" class="auth-message" aria-live="polite"></div>
<button type="submit" class="btn btn-primary btn-full">SAVE QUIZ</button>
</form>
</section></main>
<script>window.EP_REQUIRED_ROLE = ["teacher", "admin"];</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-helpers.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard-guard.js"></script>
<script src="js/create-quiz.js"></script>
</body>
</html>
