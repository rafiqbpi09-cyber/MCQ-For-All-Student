<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>First-Time Admin Setup | Education Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
<section class="auth-card">
<div class="brand">
<div class="logo-placeholder">EP</div>
<h1>Education Platform</h1>
<p>One-Time Setup</p>
</div>
<div class="auth-content">
<h2>Create First Admin</h2>
<p class="auth-subtitle">Use this only once to create your first Super Admin account. Delete this file from GitHub right after.</p>
<form id="setupAdminForm" novalidate>
<div class="form-group">
<label for="adminName">Full Name</label>
<input type="text" id="adminName" name="name" placeholder="Enter full name" autocomplete="name">
</div>
<div class="form-group">
<label for="adminMobile">Mobile Number</label>
<input type="text" id="adminMobile" name="mobile" placeholder="Enter mobile number" autocomplete="username">
</div>
<div class="form-group">
<label for="adminPassword">Password</label>
<div class="password-wrapper">
<input type="password" id="adminPassword" name="password" placeholder="Enter password" data-password-target="adminPassword" autocomplete="new-password">
<button type="button" class="password-toggle" data-password-target="adminPassword" aria-label="Show password">Show</button>
</div>
</div>
<div id="setupAdminMessage" class="auth-message" aria-live="polite"></div>
<button type="submit" class="btn btn-primary btn-full">CREATE FIRST ADMIN</button>
</form>
</div>
<footer class="auth-footer">&copy; <span id="currentYear"></span> Education Platform. All rights reserved.</footer>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-helpers.js"></script>
<script src="js/app.js"></script>
<script src="js/setup-admin.js"></script>
</body>
</html>
