<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Settings | Education Platform</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="dashboard-page"><section class="dashboard-card" style="max-width:820px">
<div class="dashboard-header"><div><span class="dashboard-label">Admin</span><h1>Admin Settings</h1></div><a href="admin-dashboard.html" class="btn btn-secondary">Back</a></div>

<div id="asLoading" style="text-align:center;color:var(--muted);padding:50px 0">Loading admin settings...</div>

<div id="asContent" style="display:none">

  <div class="as-profile-head">
    <div class="as-avatar-wrap">
      <div class="as-avatar" id="asAvatar">A</div>
      <button type="button" class="as-avatar-edit" id="asAvatarEditBtn" aria-label="Change profile photo" title="Change profile photo">&#9998;</button>
      <input type="file" id="asPhotoInput" accept="image/*" style="display:none">
    </div>
    <div class="as-profile-meta">
      <h3 id="asDisplayName">Admin</h3>
      <p id="asDisplaySub">Admin Account</p>
      <div class="as-profile-actions">
        <button type="button" class="btn btn-secondary" id="asChangePhotoBtn">Change Photo</button>
        <button type="button" class="btn btn-secondary" id="asRemovePhotoBtn">Remove Photo</button>
      </div>
    </div>
  </div>
  <div id="asPhotoMessage" class="auth-message" aria-live="polite"></div>

  <div class="as-section">
    <h2 class="as-section-title">Account Overview</h2>
    <div class="as-info-grid">
      <div class="as-info-item"><p class="as-info-label">Email (Login ID)</p><p class="as-info-value" id="asInfoEmail">&mdash;</p></div>
      <div class="as-info-item"><p class="as-info-label">Phone</p><p class="as-info-value" id="asInfoPhone">&mdash;</p></div>
      <div class="as-info-item"><p class="as-info-label">Role &amp; Access Level</p><p class="as-info-value" id="asInfoRole">&mdash;</p></div>
      <div class="as-info-item"><p class="as-info-label">Account Status</p><p class="as-info-value" id="asInfoStatus">&mdash;</p></div>
      <div class="as-info-item"><p class="as-info-label">Account Created</p><p class="as-info-value" id="asInfoCreated">&mdash;</p></div>
      <div class="as-info-item"><p class="as-info-label">Last Login</p><p class="as-info-value" id="asInfoLastLogin">&mdash;</p></div>
    </div>
  </div>

  <hr class="as-divider">

  <div class="as-section">
    <h2 class="as-section-title">Edit Profile</h2>
    <form id="asProfileForm" novalidate>
      <div class="as-grid">
        <div class="form-group"><label for="asFullName">Full Name</label><input type="text" id="asFullName" placeholder="Your full name"></div>
        <div class="form-group"><label for="asUsername">Username</label><input type="text" id="asUsername" placeholder="Choose a username"></div>
      </div>
      <div id="asProfileMessage" class="auth-message" aria-live="polite"></div>
      <button type="submit" class="btn btn-primary btn-full">SAVE PROFILE</button>
    </form>
  </div>

  <hr class="as-divider">

  <div class="as-section">
    <h2 class="as-section-title">Password &amp; Security</h2>
    <form id="asPasswordForm" novalidate>
      <div class="form-group">
        <label for="asCurrentPassword">Current Password</label>
        <div class="password-wrapper"><input type="password" id="asCurrentPassword" data-as-password-target="asCurrentPassword"><button type="button" class="password-toggle" data-as-password-target="asCurrentPassword" aria-label="Show password">Show</button></div>
      </div>
      <div class="form-group">
        <label for="asNewPassword">New Password</label>
        <div class="password-wrapper"><input type="password" id="asNewPassword" data-as-password-target="asNewPassword"><button type="button" class="password-toggle" data-as-password-target="asNewPassword" aria-label="Show password">Show</button></div>
      </div>
      <div class="form-group">
        <label for="asConfirmPassword">Confirm New Password</label>
        <div class="password-wrapper"><input type="password" id="asConfirmPassword" data-as-password-target="asConfirmPassword"><button type="button" class="password-toggle" data-as-password-target="asConfirmPassword" aria-label="Show password">Show</button></div>
      </div>
      <div id="asPasswordMessage" class="auth-message" aria-live="polite"></div>
      <button type="submit" class="btn btn-primary btn-full">CHANGE PASSWORD</button>
    </form>
  </div>

</div>

<div id="asErrorBox" style="display:none;text-align:center;color:var(--danger)"></div>

</section></main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  'use strict';

  // ---- Self-contained Firebase setup (matches the pattern used on
  // Manage Users / My Quizzes so this page is not affected by any
  // shared-script load-order issues). ----
  var config={apiKey:'AIzaSyDM13kU5-lT7DSlsCp2tVCZkMVAymlzHNg',authDomain:'mcq-6to12.firebaseapp.com',projectId:'mcq-6to12',storageBucket:'mcq-6to12.firebasestorage.app',messagingSenderId:'784808401512',appId:'1:784808401512:web:7ab4aaa43f20aeab9739dd'};
  try{firebase.initializeApp(config);}catch(e){if(!/already exists/i.test(e.message||''))throw e;}
  var auth=firebase.auth(), db=firebase.firestore();

  function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
  function timeout(p,ms){var t;var x=new Promise(function(_,r){t=setTimeout(function(){r(new Error('TIMEOUT'));},ms);});return Promise.race([p,x]).finally(function(){clearTimeout(t);});}
  function err(e){if(e&&e.message==='TIMEOUT')return 'Connection timed out. Please check your internet connection.';return esc(e&&(e.code||e.message)||'Unknown error');}
  function capitalize(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):'';}
  function initials(name){if(!name)return 'A';var t=String(name).trim();return t?t.charAt(0).toUpperCase():'A';}
  function formatDate(d){if(!d)return '\u2014';try{return d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return String(d);}}

  function showMsg(id,text,type){var el=document.getElementById(id);if(!el)return;el.textContent=text;el.className='auth-message show '+type;}

  var loadingBox=document.getElementById('asLoading');
  var contentBox=document.getElementById('asContent');
  var errorBox=document.getElementById('asErrorBox');

  function showFatalError(message){
    loadingBox.style.display='none';
    contentBox.style.display='none';
    errorBox.style.display='block';
    errorBox.innerHTML=esc(message)+'<br><button type="button" class="btn btn-secondary" style="margin-top:14px" onclick="location.reload()">Retry</button>';
  }

  // ---- Password show/hide toggles (scoped to this page) ----
  document.querySelectorAll('[data-as-password-target].password-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      var input=document.getElementById(btn.getAttribute('data-as-password-target'));
      if(!input)return;
      var showing=input.type==='text';
      input.type=showing?'password':'text';
      btn.textContent=showing?'Show':'Hide';
      btn.setAttribute('aria-label',showing?'Show password':'Hide password');
    });
  });

  var currentUid=null, currentName='', currentPhotoURL='';
  var avatarEl=document.getElementById('asAvatar');

  function renderAvatar(){
    avatarEl.innerHTML = currentPhotoURL
      ? '<img src="'+esc(currentPhotoURL)+'" alt="Profile photo">'
      : esc(initials(currentName));
  }

  function load(user){
    currentUid=user.uid;
    timeout(db.collection('users').doc(user.uid).get(),12000).then(function(docSnap){
      if(!docSnap.exists){showFatalError('Your admin profile was not found.');return;}
      var data=docSnap.data()||{};
      if(data.role!=='admin'){window.location.href='access-denied.html';return;}

      currentName=data.name||'';
      currentPhotoURL=data.photoURL||'';

      document.getElementById('asDisplayName').textContent=currentName||'Admin';
      document.getElementById('asDisplaySub').textContent=capitalize(data.role)+' Account';
      renderAvatar();

      document.getElementById('asInfoEmail').textContent=user.email||'\u2014';
      document.getElementById('asInfoPhone').textContent=data.mobile||'\u2014';
      document.getElementById('asInfoRole').textContent=capitalize(data.role)+' \u00b7 Full Access';

      var status=(data.status||'active').toLowerCase();
      document.getElementById('asInfoStatus').innerHTML='<span class="as-badge '+(status==='active'?'active':'inactive')+'">'+esc(capitalize(status))+'</span>';

      var created=null;
      if(data.createdAt&&typeof data.createdAt.toDate==='function')created=data.createdAt.toDate();
      else if(user.metadata&&user.metadata.creationTime)created=new Date(user.metadata.creationTime);
      document.getElementById('asInfoCreated').textContent=formatDate(created);

      var lastLogin=(user.metadata&&user.metadata.lastSignInTime)?new Date(user.metadata.lastSignInTime):null;
      document.getElementById('asInfoLastLogin').textContent=formatDate(lastLogin);

      document.getElementById('asFullName').value=currentName;
      var usernameFallback=(data.mobile||'').replace(/[^a-zA-Z0-9._-]/g,'');
      document.getElementById('asUsername').value=data.username||usernameFallback||'';

      loadingBox.style.display='none';
      contentBox.style.display='block';
    }).catch(function(e){
      showFatalError('Could not load admin settings: '+err(e));
    });
  }

  // ---- Edit Profile ----
  var profileForm=document.getElementById('asProfileForm');
  profileForm.addEventListener('submit', function(event){
    event.preventDefault();
    var name=document.getElementById('asFullName').value.trim();
    var username=document.getElementById('asUsername').value.trim();
    var submitBtn=profileForm.querySelector('button[type="submit"]');

    if(!name){showMsg('asProfileMessage','Please enter your full name.','error');return;}
    if(!username){showMsg('asProfileMessage','Please enter a username.','error');return;}
    if(!/^[a-zA-Z0-9._-]{3,30}$/.test(username)){showMsg('asProfileMessage','Username must be 3-30 characters (letters, numbers, dot, underscore, hyphen).','error');return;}

    submitBtn.disabled=true;
    timeout(db.collection('users').doc(currentUid).update({name:name,username:username}),12000).then(function(){
      currentName=name;
      document.getElementById('asFullName').value=name;
      document.getElementById('asUsername').value=username;
      document.getElementById('asDisplayName').textContent=name;
      renderAvatar();
      showMsg('asProfileMessage','Profile updated successfully.','success');
    }).catch(function(e){
      showMsg('asProfileMessage','Could not update profile: '+err(e),'error');
    }).finally(function(){
      submitBtn.disabled=false;
    });
  });

  // ---- Change Password ----
  var passwordForm=document.getElementById('asPasswordForm');
  passwordForm.addEventListener('submit', function(event){
    event.preventDefault();
    var currentPassword=document.getElementById('asCurrentPassword').value;
    var newPassword=document.getElementById('asNewPassword').value;
    var confirmPassword=document.getElementById('asConfirmPassword').value;
    var submitBtn=passwordForm.querySelector('button[type="submit"]');
    var user=auth.currentUser;

    if(!currentPassword||!newPassword){showMsg('asPasswordMessage','Please fill in all password fields.','error');return;}
    if(newPassword.length<6){showMsg('asPasswordMessage','New password must be at least 6 characters long.','error');return;}
    if(newPassword!==confirmPassword){showMsg('asPasswordMessage','New passwords do not match.','error');return;}
    if(!user)return;

    submitBtn.disabled=true;
    showMsg('asPasswordMessage','Updating password...','success');

    var credential=firebase.auth.EmailAuthProvider.credential(user.email,currentPassword);
    user.reauthenticateWithCredential(credential).then(function(){
      return user.updatePassword(newPassword);
    }).then(function(){
      showMsg('asPasswordMessage','Password changed successfully.','success');
      passwordForm.reset();
    }).catch(function(e){
      if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'){
        showMsg('asPasswordMessage','Current password is incorrect.','error');
      }else{
        showMsg('asPasswordMessage','Could not change password: '+err(e),'error');
      }
    }).finally(function(){
      submitBtn.disabled=false;
    });
  });

  // ---- Profile photo (stored as a compressed data URL on the user doc,
  // so no Firebase Storage rules/setup is required) ----
  var photoInput=document.getElementById('asPhotoInput');
  var changePhotoBtn=document.getElementById('asChangePhotoBtn');
  var avatarEditBtn=document.getElementById('asAvatarEditBtn');
  var removePhotoBtn=document.getElementById('asRemovePhotoBtn');

  function openPicker(){photoInput.click();}
  changePhotoBtn.addEventListener('click',openPicker);
  avatarEditBtn.addEventListener('click',openPicker);

  function resizeImageFile(file,size){
    return new Promise(function(resolve,reject){
      if(!file.type||file.type.indexOf('image/')!==0){reject(new Error('Please choose a valid image file.'));return;}
      if(file.size>8*1024*1024){reject(new Error('Image is too large. Please choose a file under 8MB.'));return;}
      var reader=new FileReader();
      reader.onerror=function(){reject(new Error('Could not read the selected file.'));};
      reader.onload=function(){
        var img=new Image();
        img.onerror=function(){reject(new Error('Could not read the selected image.'));};
        img.onload=function(){
          var canvas=document.createElement('canvas');
          canvas.width=size;canvas.height=size;
          var ctx=canvas.getContext('2d');
          var side=Math.min(img.width,img.height);
          var sx=(img.width-side)/2, sy=(img.height-side)/2;
          ctx.drawImage(img,sx,sy,side,side,0,0,size,size);
          resolve(canvas.toDataURL('image/jpeg',0.82));
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', function(){
    var file=photoInput.files&&photoInput.files[0];
    photoInput.value='';
    if(!file)return;
    changePhotoBtn.disabled=true;
    avatarEditBtn.disabled=true;
    showMsg('asPhotoMessage','Uploading photo...','success');
    resizeImageFile(file,240).then(function(dataUrl){
      if(dataUrl.length>900000){throw new Error('Processed image is too large. Please try a smaller photo.');}
      return timeout(db.collection('users').doc(currentUid).update({photoURL:dataUrl}),15000).then(function(){
        currentPhotoURL=dataUrl;
        renderAvatar();
        showMsg('asPhotoMessage','Profile photo updated.','success');
      });
    }).catch(function(e){
      showMsg('asPhotoMessage',e&&e.message&&!e.code?e.message:('Could not update photo: '+err(e)),'error');
    }).finally(function(){
      changePhotoBtn.disabled=false;
      avatarEditBtn.disabled=false;
    });
  });

  removePhotoBtn.addEventListener('click', function(){
    if(!currentPhotoURL){showMsg('asPhotoMessage','No profile photo to remove.','error');return;}
    if(!confirm('Remove your profile photo?'))return;
    removePhotoBtn.disabled=true;
    timeout(db.collection('users').doc(currentUid).update({photoURL:firebase.firestore.FieldValue.delete()}),12000).then(function(){
      currentPhotoURL='';
      renderAvatar();
      showMsg('asPhotoMessage','Profile photo removed.','success');
    }).catch(function(e){
      showMsg('asPhotoMessage','Could not remove photo: '+err(e),'error');
    }).finally(function(){
      removePhotoBtn.disabled=false;
    });
  });

  // ---- Auth gate ----
  if(!window.firebase){showFatalError('Firebase SDK did not load. Check the Firebase CDN connection.');return;}
  var started=false;
  auth.onAuthStateChanged(function(user){
    if(started)return;
    if(!user){showFatalError('Your login session was not found. Please log in again.');return;}
    started=true;
    load(user);
  });
  setTimeout(function(){if(!started&&!auth.currentUser)showFatalError('Firebase login is still initializing. Please refresh and try again.');},8000);
})();
</script>
</body>
</html>
