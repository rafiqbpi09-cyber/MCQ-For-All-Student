<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Quizzes | Education Platform</title><link rel="icon" href="assets/favicon.ico" sizes="any"><link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><link rel="stylesheet" href="css/style.css"></head>
<body><main class="dashboard-page"><section class="dashboard-card">
<div class="dashboard-header"><div><span class="dashboard-label">Manage</span><h1>My Quizzes</h1></div><a href="index.html" id="backButton" class="btn btn-secondary">Back</a></div>
<div id="myQuizzesContainer"><p style="text-align:center;color:var(--muted)">Loading your quizzes...</p></div>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  'use strict';
  const container=document.getElementById('myQuizzesContainer');
  const config={apiKey:'AIzaSyDM13kU5-lT7DSlsCp2tVCZkMVAymlzHNg',authDomain:'mcq-6to12.firebaseapp.com',projectId:'mcq-6to12',storageBucket:'mcq-6to12.firebasestorage.app',messagingSenderId:'784808401512',appId:'1:784808401512:web:7ab4aaa43f20aeab9739dd'};
  function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
  function out(msg,danger){container.innerHTML='<p style="text-align:center;color:'+(danger?'var(--danger)':'var(--muted)')+'">'+msg+'</p>';}
  function timeout(p,ms){let t;const x=new Promise((_,r)=>t=setTimeout(()=>r(new Error('TIMEOUT')),ms));return Promise.race([p,x]).finally(()=>clearTimeout(t));}
  function err(e){if(e&&e.message==='TIMEOUT')return 'Firebase connection timed out. Please check Firebase/Firestore and your internet connection.';return esc(e&&(e.code||e.message)||'Unknown Firebase error');}
  try{firebase.initializeApp(config);}catch(e){if(!/already exists/i.test(e.message||''))throw e;}
  const auth=firebase.auth(),db=firebase.firestore();
  async function load(user){
    out('Loading your quizzes...');
    try{
      const me=await timeout(db.collection('users').doc(user.uid).get(),12000);
      const role=me.exists?(me.data().role||null):null;
      if(!['teacher','school','coaching','admin'].includes(role)){out('You do not have permission to view quizzes.',true);return;}
      const q=role==='admin'?db.collection('quizzes'):db.collection('quizzes').where('createdBy','==',user.uid);
      const snap=await timeout(q.get(),12000);
      if(snap.empty){out("You haven't created any quizzes yet.");return;}
      container.innerHTML='';
      snap.forEach(doc=>{const quiz=doc.data()||{},count=Array.isArray(quiz.questions)?quiz.questions.length:0,card=document.createElement('div');card.className='quiz-list-card';card.innerHTML='<div><h3>'+esc(quiz.title||'Untitled Quiz')+'</h3><p class="quiz-meta">'+count+' question'+(count===1?'':'s')+' &middot; by '+esc(quiz.createdByName||'Unknown')+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-secondary" href="quiz-results.html?id='+encodeURIComponent(doc.id)+'">Results</a><a class="btn btn-secondary" href="create-quiz.html?id='+encodeURIComponent(doc.id)+'">Edit</a><button type="button" class="btn btn-secondary btn-delete-quiz" data-id="'+esc(doc.id)+'" style="color:var(--danger)">Delete</button></div>';container.appendChild(card);});
      container.querySelectorAll('.btn-delete-quiz').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Delete this quiz? This cannot be undone.'))return;b.disabled=true;try{await timeout(db.collection('quizzes').doc(b.dataset.id).delete(),12000);const c=b.closest('.quiz-list-card');if(c)c.remove();if(!container.querySelector('.quiz-list-card'))out("You haven't created any quizzes yet.");}catch(e){b.disabled=false;alert('Could not delete: '+err(e));}}));
    }catch(e){out('Could not load quizzes: '+err(e)+'<br><button type="button" class="btn btn-secondary" style="margin-top:10px" onclick="location.reload()">Retry</button>',true);}
  }
  if(!window.firebase){out('Firebase SDK did not load. Check the Firebase CDN connection.',true);return;}
  let started=false;
  auth.onAuthStateChanged(user=>{if(started)return;if(!user){out('Your login session was not found. Please log in again.',true);return;}started=true;load(user);});
  setTimeout(()=>{if(!started&&!auth.currentUser)out('Firebase login is still initializing. Please refresh and try again.',true);},8000);
})();
</script>
</body></html>
