<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Education Platform</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page">
<section class="auth-card">
<div class="brand">
<div class="logo-placeholder">EP</div>
<h1>Education Platform</h1>
<p>Learn • Practice • Improve</p>
</div>
<div class="auth-content">
<h2>Forgot Password?</h2>
<p class="auth-subtitle">Enter your registered email address to reset your password.</p>
<form id="forgotPasswordForm" novalidate>
<div class="form-group">
<label for="resetEmail">Email Address</label>
<input type="email" id="resetEmail" name="email" placeholder="Enter your email address" autocomplete="email">
</div>
<div id="resetMessage" class="auth-message" aria-live="polite"></div>
<button type="submit" class="btn btn-primary btn-full">SEND RESET LINK</button>
</form>
<div class="back-link"><a href="login.html">&larr; Back to Login</a></div>
</div>
<footer class="auth-footer">&copy; <span id="currentYear"></span> Education Platform. All rights reserved.</footer>
</section>
</main>
<script src="js/app.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
