<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Users | Education Platform</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="dashboard-page"><section class="dashboard-card">
<div class="dashboard-header"><div><span class="dashboard-label">Admin</span><h1>Manage Users</h1></div><a href="admin-dashboard.html" class="btn btn-secondary">Back</a></div>
<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Search, filter, manage roles and control user access from one professional panel.</p><div class="mu-toolbar"><input id="userSearch" class="mu-search" type="search" placeholder="Search by name, email or mobile..."><select id="roleFilter" class="mu-filter"><option value="all">All Roles</option><option value="student">Student</option><option value="teacher">Teacher</option><option value="school">School</option><option value="coaching">Coaching</option><option value="admin">Admin</option></select><select id="statusFilter" class="mu-filter"><option value="all">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div id="userSummary" class="mu-summary"></div>
<div id="usersContainer"><p style="text-align:center;color:var(--muted)">Loading users...</p></div>
</section></main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>window.EP_REQUIRED_ROLE = "admin";</script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-helpers.js"></script>
<script src="js/app.js"></script>

</body></html>
